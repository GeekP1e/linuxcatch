name: linuxcatch

services:
  sandbox:
    image: linuxcatch-sandbox:local
    build: ./sandbox
    command: ["/usr/bin/true"]

  backend:
    build:
      context: ./backend
      args:
        RUST_BUILD_IMAGE: ${RUST_BUILD_IMAGE:-rust:1.94-slim-bookworm}
    depends_on:
      sandbox:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_IMAGE: linuxcatch-sandbox:local
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      RUST_LOG: linuxcatch_backend=info
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, linuxcatch-backend, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - ${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:80
    depends_on:
      backend:
        condition: service_healthy
